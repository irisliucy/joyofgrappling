<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Joy of Grappling — Reap</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <header>
    <h1>Joy of Grappling</h1>
    <p class="subtitle">Reap: search a position or style → auto-build a credibility-scored technique graph.</p>
  </header>

  <form id="research-form">
    <input id="query-input" type="text" placeholder="e.g. K guard" />
    <input id="player-input" type="text" placeholder="target player (optional), e.g. Mateusz Szczeciński" />
    <button type="submit">Research</button>
  </form>

  <div id="status" class="status" hidden></div>

  <main id="results" hidden>
    <section class="graph-panel">
      <h2>Technique graph</h2>
      <div class="legend" id="legend"></div>
      <div class="stage-filter" id="stage-filter"></div>
      <div id="mindmap"></div>
      <div class="graph-stats" id="graph-stats"></div>
    </section>
    <section class="insights-panel">
      <h2>Key insights</h2>
      <ul id="insights-list"></ul>
      <h2>Contested</h2>
      <ul id="contested-list"></ul>
      <h2>Sources</h2>
      <ul id="sources-list"></ul>
    </section>
  </main>

  <footer style="max-width: 900px; margin: 30px auto 0; text-align: center; font-size: 12px;">
    <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
