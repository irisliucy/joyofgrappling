app = "joyofgrappling"
primary_region = "sjc"

[build]

[env]
  DATA_DIR = "/data"

[mounts]
  source = "joyofgrappling_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
